name: Tests

on:
  push:
    branches: [ main, master, trunk ]
  pull_request:
    branches: [ main, master, trunk ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false  # Continue running other OS tests even if one fails
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libspdlog-dev \
          libfmt-dev
        
        # FTXUI might not be in Ubuntu repos, so build from source
        git clone https://github.com/ArthurSonzogni/FTXUI.git
        cd FTXUI
        mkdir build && cd build
        cmake .. -DFTXUI_BUILD_EXAMPLES=OFF -DFTXUI_BUILD_TESTS=OFF -DFTXUI_BUILD_DOCS=OFF \
                 -DCMAKE_INSTALL_PREFIX=/usr/local
        make -j$(nproc)
        sudo make install
        sudo ldconfig
        
        # Verify installation
        pkg-config --modversion ftxui || echo "ftxui not found via pkg-config"
    
    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install ftxui spdlog fmt
    
    - name: Build and run tests
      working-directory: src
      run: |
        echo "Checking library installations..."
        pkg-config --modversion ftxui || echo "Warning: ftxui not found via pkg-config"
        pkg-config --modversion spdlog || echo "Warning: spdlog not found via pkg-config"
        pkg-config --modversion fmt || echo "Warning: fmt not found via pkg-config"
        
        echo ""
        echo "Building application and tests..."
        make clean
        make all
        
        echo ""
        echo "Running tests..."
        # Use CI-specific runner if in CI environment, otherwise regular runner
        if [ -n "$CI" ]; then
          ./run_tests_ci.sh
        else
          ./run_tests.sh
        fi
    
    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: |
          src/test-persist
          src/test-state
          src/test-events
          src/test-input
        retention-days: 7